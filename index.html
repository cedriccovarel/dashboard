<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mytoolapp</title>
<meta name="theme-color" content="#f4f7f5" />
<style>
:root{
  --bg:#f4f7f5;
  --panel:#fff;
  --line:#dfe8e3;
  --text:#19382e;
  --muted:#7a8881;
  --green:#1f5a44;
  --green2:#2f715a;
  --soft:#eaf2ed;
  --danger:#b84f57;
  --shadow:0 8px 24px rgba(31,90,68,.06);
  --shadow2:0 14px 30px rgba(31,90,68,.10);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit} button{cursor:pointer}
.shell{width:min(1380px,calc(100% - 40px));margin:0 auto;padding:24px 0 54px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:24px}
.brand{font-size:21px;font-weight:800;letter-spacing:-.025em;color:var(--green)}
.actions{display:flex;gap:9px;align-items:center}
.btn{border-radius:11px;padding:11px 14px;font-size:13px;font-weight:750;border:1px solid var(--line);background:#fff;color:var(--text)}
.btn:hover{border-color:#bfd0c7;background:#fbfcfb}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn.primary:hover{background:var(--green2)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.card{position:relative;min-height:246px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:.16s ease;overflow:hidden}
.card:hover{transform:translateY(-2px);border-color:#c6d7ce;box-shadow:var(--shadow2)}
.card.dragging{opacity:.42;transform:scale(.985)}.card.drag-over{border-color:#8caf9d;box-shadow:0 0 0 3px rgba(31,90,68,.08),var(--shadow2)}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.logo{width:112px;height:112px;border-radius:22px;overflow:hidden;background:var(--soft);border:1px solid #d8e4dd;display:grid;place-items:center;color:var(--green);font-weight:900;font-size:30px;flex:0 0 auto}
.logo img{width:100%;height:100%;object-fit:contain;padding:8px;background:#fff}
.card-tools{display:flex;align-items:center;gap:2px}.drag-handle,.more{border:0;background:transparent;color:#98a59f;padding:3px 5px}.drag-handle{font-size:17px;cursor:grab}.drag-handle:active{cursor:grabbing}.more{font-size:17px}
.card h3{font-size:15px;line-height:1.22;margin:13px 0 4px;letter-spacing:-.01em}
.desc{font-size:10px;line-height:1.4;color:var(--muted);margin:0;max-width:95%;min-height:28px}
.bottom{margin-top:auto;padding-top:14px;display:flex;justify-content:flex-end}.open{text-decoration:none;color:var(--green);font-size:11px;font-weight:750;border:1px solid #c5d7cd;background:#fff;padding:7px 10px;border-radius:9px}.open:hover{background:var(--green);color:#fff;border-color:var(--green)}
.menu{position:absolute;right:14px;top:47px;z-index:5;display:none;background:#fff;border:1px solid var(--line);border-radius:10px;padding:5px;box-shadow:0 14px 35px rgba(31,90,68,.12)}.menu.show{display:grid}.menu button{border:0;background:transparent;color:var(--text);text-align:left;padding:8px 11px;border-radius:8px;font-size:12px;min-width:110px}.menu button:hover{background:#f1f5f3}.menu .delete{color:var(--danger)}
.empty{display:none;border:1px dashed #cbd8d1;border-radius:16px;padding:44px 20px;text-align:center;color:var(--muted);background:#fff}.empty.show{display:block}
.backdrop{position:fixed;inset:0;background:rgba(21,48,39,.28);display:none;z-index:20}.backdrop.show{display:block}
.drawer{position:fixed;right:0;top:0;width:min(420px,100%);height:100vh;z-index:21;background:#f9fbfa;border-left:1px solid var(--line);box-shadow:-24px 0 55px rgba(31,90,68,.12);padding:22px;overflow:auto;transform:translateX(105%);transition:.22s}.drawer.show{transform:translateX(0)}
.drawer-head{display:flex;align-items:center;justify-content:space-between}.drawer h2{margin:0;font-size:21px}.close{border:0;background:transparent;color:#7e8c85;font-size:27px}
.form{display:grid;gap:15px;margin-top:22px}.field label{display:block;font-weight:750;margin-bottom:7px;font-size:13px}.field input,.field select{width:100%;background:#fff;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}.field input:focus,.field select:focus{border-color:#9db9aa;box-shadow:0 0 0 3px rgba(31,90,68,.06)}
.type-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.type-btn{border:1px solid var(--line);background:#fff;color:#6d7b74;border-radius:10px;padding:10px;font-size:12px;font-weight:750}.type-btn.active{border-color:#9fbdad;color:var(--green);background:var(--soft)}
.dropzone{border:1px dashed #b9cbc1;border-radius:13px;padding:20px;text-align:center;color:var(--muted);background:#fff;font-size:12px}.dropzone strong{display:block;color:var(--text);margin:5px 0;font-size:13px}.dropzone input{display:none}
.preview{border:1px solid var(--line);border-radius:13px;padding:12px;background:#fff;display:flex;align-items:center;gap:12px}.preview .logo{width:76px;height:76px;border-radius:17px}.preview strong{display:block;font-size:13px}.preview small{color:var(--muted);font-size:11px}
.drawer-actions{display:grid;grid-template-columns:1fr auto;gap:9px;margin-top:2px}.ghost{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:10px;padding:10px 12px;font-size:12px;font-weight:750}.primary-action{border:1px solid var(--green);background:var(--green);color:#fff;border-radius:10px;padding:10px 13px;font-size:12px;font-weight:750}
.settings-box{display:grid;gap:16px}.settings-note{font-size:11px;line-height:1.5;color:var(--muted);margin-top:-4px}.setting-actions{display:grid;gap:8px}.setting-actions button{width:100%;text-align:left;border:1px solid var(--line);background:#fff;color:var(--text);border-radius:10px;padding:11px 12px;font-size:12px}.setting-actions button:hover{background:#f3f7f5}.setting-actions .danger{color:var(--danger)}
@media(max-width:1120px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:820px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.shell{width:min(100% - 24px,1380px)}}
@media(max-width:560px){.grid{grid-template-columns:1fr}.brand{font-size:19px}.btn{padding:10px 12px}.logo{width:104px;height:104px}}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">Mytoolapp</div>
    <div class="actions">
      <button class="btn" id="settingsBtn">Réglages</button>
      <button class="btn primary" id="addBtn">+ Ajouter</button>
    </div>
  </header>
  <main>
    <section class="grid" id="grid"></section>
    <div class="empty" id="empty">Aucune application.</div>
  </main>
</div>

<div class="backdrop" id="backdrop"></div>

<aside class="drawer" id="appDrawer">
  <div class="drawer-head"><h2 id="drawerTitle">Ajouter une application</h2><button class="close" data-close>×</button></div>
  <div class="form">
    <div class="field"><label>Type</label><div class="type-row"><button class="type-btn active" data-type="internal">Outil interne</button><button class="type-btn" data-type="public">Site public</button></div></div>
    <div class="field"><label>Nom</label><input id="appName" placeholder="Ex. : Google Drive" maxlength="70" /></div>
    <div class="field"><label>Lien</label><input id="appLink" type="url" placeholder="https://..." /></div>
    <div class="field"><label>Logo</label><label class="dropzone" for="logoFile"><div style="font-size:23px">＋</div><strong>Choisir un logo</strong><span>PNG, JPG, WEBP ou SVG</span><input id="logoFile" type="file" accept="image/*,.svg" /></label></div>
    <div class="field"><label>Description <span style="color:var(--muted);font-weight:500">(facultatif)</span></label><input id="appDesc" placeholder="Courte description" maxlength="150" /></div>
    <div class="field"><label>Aperçu</label><div class="preview"><div class="logo" id="previewLogo">A</div><div><strong id="previewName">Mon application</strong><small id="previewType">Outil interne</small></div></div></div>
    <div class="drawer-actions"><button class="primary-action" id="saveApp">Créer</button><button class="ghost" data-close>Annuler</button></div>
  </div>
</aside>

<aside class="drawer" id="settingsDrawer">
  <div class="drawer-head"><h2>Réglages</h2><button class="close" data-close>×</button></div>
  <div class="form settings-box">
    <div class="field">
      <label for="sort">Ordre des tuiles</label>
      <select id="sort">
        <option value="custom">Ordre personnalisé</option>
        <option value="name-asc">Nom A → Z</option>
        <option value="name-desc">Nom Z → A</option>
      </select>
      <div class="settings-note">Tu peux aussi déplacer les tuiles directement avec la poignée ⋮⋮. Cela repasse automatiquement en ordre personnalisé.</div>
    </div>
    <div class="setting-actions">
      <button id="resetOrder">Réinitialiser l’ordre</button>
      <button id="resetAll" class="danger">Réinitialiser Mytoolapp</button>
    </div>
  </div>
</aside>

<script>
const DEFAULT_APPS=[
{id:'gen',name:'Générateur Prestaterre',link:'#',type:'internal',description:'Création et export des slides et indicateurs Prestaterre.',logo:'',createdAt:1},
{id:'siap',name:'Rapprochement SIAP',link:'#',type:'internal',description:'Rapprochement multi-critères avec les données SIAP.',logo:'',createdAt:2},
{id:'sheets',name:'Google Sheets',link:'https://docs.google.com/spreadsheets/',type:'public',description:'Feuilles de calcul et tableaux partagés.',logo:'',createdAt:3},
{id:'drive',name:'Google Drive',link:'https://drive.google.com/',type:'public',description:'Stockage et partage de fichiers.',logo:'',createdAt:4},
{id:'chatgpt',name:'ChatGPT',link:'https://chatgpt.com/',type:'public',description:'Assistant IA pour l’analyse, la rédaction et la création.',logo:'',createdAt:5},
{id:'odoo',name:'Odoo',link:'https://www.odoo.com/',type:'public',description:'Suite d’applications de gestion d’entreprise.',logo:'',createdAt:6}
];
const STORE='prestaterre_toolbox_minimal_v1', SORT_STORE='mytoolapp_sort_v1';
let apps=[],sortMode=localStorage.getItem(SORT_STORE)||'custom',currentType='internal',editingId=null,uploadedLogo='',dragId=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s||'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));
function initials(n){return (n||'A').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()||'A'}
function safeUrl(u){try{const x=new URL(u);return ['http:','https:'].includes(x.protocol)?x.href:'#'}catch(e){return '#'}}
function load(){try{const v=JSON.parse(localStorage.getItem(STORE)||'null');apps=Array.isArray(v)&&v.length?v:DEFAULT_APPS.map(x=>({...x}))}catch(e){apps=DEFAULT_APPS.map(x=>({...x}))}$('sort').value=sortMode;render()}
function persist(){localStorage.setItem(STORE,JSON.stringify(apps))}
function logoHtml(a){return a.logo?`<img src="${a.logo}" alt="">`:esc(initials(a.name))}
function currentList(){const list=apps.slice();if(sortMode==='name-asc')list.sort((a,b)=>a.name.localeCompare(b.name,'fr'));if(sortMode==='name-desc')list.sort((a,b)=>b.name.localeCompare(a.name,'fr'));return list}
function render(){const list=currentList();$('grid').innerHTML=list.map(a=>`<article class="card" data-id="${esc(a.id)}"><div class="card-top"><div class="logo">${logoHtml(a)}</div><div class="card-tools"><button class="drag-handle" draggable="true" title="Déplacer">⋮⋮</button><button class="more" title="Options">•••</button></div></div><h3>${esc(a.name)}</h3><p class="desc">${esc(a.description||'')}</p><div class="bottom"><a class="open" href="${safeUrl(a.link)}" target="_blank" rel="noopener noreferrer">Ouvrir ↗</a></div><div class="menu"><button class="edit">Modifier</button><button class="delete">Supprimer</button></div></article>`).join('');$('empty').classList.toggle('show',!list.length);bindDrag()}
function bindDrag(){document.querySelectorAll('.card').forEach(card=>{const handle=card.querySelector('.drag-handle');handle.addEventListener('dragstart',e=>{dragId=card.dataset.id;card.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragId)});handle.addEventListener('dragend',()=>{card.classList.remove('dragging');document.querySelectorAll('.card').forEach(c=>c.classList.remove('drag-over'));dragId=null});card.addEventListener('dragover',e=>{if(!dragId||dragId===card.dataset.id)return;e.preventDefault();card.classList.add('drag-over')});card.addEventListener('dragleave',()=>card.classList.remove('drag-over'));card.addEventListener('drop',e=>{e.preventDefault();card.classList.remove('drag-over');const targetId=card.dataset.id;if(!dragId||dragId===targetId)return;reorder(dragId,targetId);dragId=null})})}
function reorder(sourceId,targetId){const ids=apps.map(a=>a.id),s=ids.indexOf(sourceId),t=ids.indexOf(targetId);if(s<0||t<0)return;const [moved]=apps.splice(s,1);apps.splice(t,0,moved);sortMode='custom';localStorage.setItem(SORT_STORE,sortMode);$('sort').value=sortMode;persist();render()}
function showDrawer(drawer){$('backdrop').classList.add('show');drawer.classList.add('show')}
function closeDrawers(){$('backdrop').classList.remove('show');document.querySelectorAll('.drawer').forEach(d=>d.classList.remove('show'));editingId=null;uploadedLogo=''}
function openAppDrawer(a=null){editingId=a?.id||null;currentType=a?.type||'internal';uploadedLogo=a?.logo||'';$('drawerTitle').textContent=a?'Modifier l’application':'Ajouter une application';$('saveApp').textContent=a?'Enregistrer':'Créer';$('appName').value=a?.name||'';$('appLink').value=a?.link||'';$('appDesc').value=a?.description||'';$('logoFile').value='';document.querySelectorAll('.type-btn').forEach(b=>b.classList.toggle('active',b.dataset.type===currentType));updatePreview();showDrawer($('appDrawer'));setTimeout(()=>$('appName').focus(),100)}
function updatePreview(){const n=$('appName').value.trim()||'Mon application';$('previewName').textContent=n;$('previewType').textContent=currentType==='public'?'Site public':'Outil interne';$('previewLogo').innerHTML=uploadedLogo?`<img src="${uploadedLogo}" alt="">`:initials(n)}
function saveApp(){const name=$('appName').value.trim(),link=$('appLink').value.trim(),description=$('appDesc').value.trim();if(!name){alert('Indique le nom de l’application.');return}if(safeUrl(link)==='#'){alert('Indique un lien valide commençant par https://');return}if(editingId){const i=apps.findIndex(a=>a.id===editingId);if(i>=0)apps[i]={...apps[i],name,link:safeUrl(link),type:currentType,description,logo:uploadedLogo}}else apps.push({id:'app-'+Date.now(),name,link:safeUrl(link),type:currentType,description,logo:uploadedLogo,createdAt:Date.now()});persist();sortMode='custom';localStorage.setItem(SORT_STORE,sortMode);$('sort').value=sortMode;render();closeDrawers()}
$('addBtn').onclick=()=>openAppDrawer();$('settingsBtn').onclick=()=>showDrawer($('settingsDrawer'));$('backdrop').onclick=closeDrawers;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeDrawers);
document.querySelectorAll('.type-btn').forEach(b=>b.onclick=()=>{currentType=b.dataset.type;document.querySelectorAll('.type-btn').forEach(x=>x.classList.toggle('active',x===b));updatePreview()});$('appName').oninput=updatePreview;$('saveApp').onclick=saveApp;
$('logoFile').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>2.5*1024*1024){alert('Choisis un logo de moins de 2,5 Mo.');return}const r=new FileReader();r.onload=()=>{uploadedLogo=r.result;updatePreview()};r.readAsDataURL(f)};
$('sort').onchange=e=>{sortMode=e.target.value;localStorage.setItem(SORT_STORE,sortMode);render()};
$('resetOrder').onclick=()=>{apps.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));sortMode='custom';localStorage.setItem(SORT_STORE,sortMode);$('sort').value=sortMode;persist();render();closeDrawers()};
$('resetAll').onclick=()=>{if(confirm('Réinitialiser toutes les applications et l’ordre ?')){apps=DEFAULT_APPS.map(x=>({...x}));sortMode='custom';localStorage.setItem(SORT_STORE,sortMode);persist();render();closeDrawers()}};
$('grid').onclick=e=>{const card=e.target.closest('.card');if(!card)return;const a=apps.find(x=>x.id===card.dataset.id);if(!a)return;if(e.target.closest('.more')){card.querySelector('.menu').classList.toggle('show');return}if(e.target.closest('.edit')){openAppDrawer(a);return}if(e.target.closest('.delete')){if(confirm(`Supprimer “${a.name}” ?`)){apps=apps.filter(x=>x.id!==a.id);persist();render()}return}};
document.addEventListener('click',e=>{if(!e.target.closest('.more'))document.querySelectorAll('.menu').forEach(m=>m.classList.remove('show'))});
load();
</script>
</body>
</html>
